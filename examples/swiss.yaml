# One config document, read by both `swiss` and `swissd`.
#
# They are one tool: the CLI and the server compose the same plans against the
# same catalog and the same cluster wiring. Two files would eventually disagree.
# What differs is which sections each one needs -- `server:` is ignored by the
# CLI, and a file-based profile is normal on a laptop and unusual in a pod.
#
# Found in this order: --config, $SWISS_CONFIG, ./swiss.yaml,
# ~/.config/swiss/swiss.yaml. The CLI works without one; swissd requires it.

# An https base or a local path. index.json is appended when the location does
# not already name a .json file. No git: a catalog is a published index plus the
# documents it points at.
#
# For swissd this is the default: a site profile naming a catalog of its own
# wins, so the catalog can be repointed from the web without a helm upgrade.
# For the CLI it is the only source -- it cannot read the profile's ConfigMap.
catalog: https://models.example.com/swiss-catalog/

cluster:
  # Where the site profile is read from. Exactly one source, named explicitly
  # rather than sniffed: "swiss/site-profile" is a plausible relative path as
  # well as a plausible ConfigMap reference, and guessing wrong means composing
  # against another cluster's wiring.
  profile:
    # In-cluster: swissd reads it through its ServiceAccount.
    configMap: swiss/site-profile
    key: profile.yaml
    # On a laptop, or a swissd with the profile mounted as a volume:
    # file: ./deploys/production/profile.yaml

  # Empty means in-cluster ServiceAccount first, then the usual kubeconfig
  # rules. Set a path to drive a cluster from outside it.
  kubeconfig: ""
  context: ""

# swissd only. The CLI parses this section and ignores it, so one file can be
# mounted into a pod and checked into a repo unchanged.
server:
  addr: ":8080"

  # How long a fetched catalog or profile is reused before refetching.
  cacheTTL: 60s

  # Where the last catalog index is kept, so a restart while the catalog is
  # unreachable still has a marketplace to render. Empty puts it beside the
  # database. Whether it survives a restart is a property of what is mounted
  # there: on an emptyDir this buys nothing the in-memory cache does not
  # already give.
  # cacheDir: /var/lib/swiss/catalog-cache

  # The site login: one account, read from a mounted Secret. A directory rather
  # than an API read, because that is what a Secret volume is -- the kubelet
  # keeps the files current, so rotating the password takes effect at the next
  # login instead of at the next restart, and swissd needs no Secret grant of
  # its own to log anybody in.
  #
  # One file per key: username, password, and optionally tokenKey. Without a
  # tokenKey the signing key is derived from the password, so a Secret made by
  # hand with two keys works -- at the cost of a password change also
  # invalidating outstanding tokens, which it does anyway.
  auth:
    dir: /etc/swiss-auth
    # How long a login lasts. Long enough not to interrupt a 40-minute model
    # load being watched; short enough that a forgotten tab is not a standing
    # key. A session in active use is extended rather than cut off.
    tokenTTL: 24h
    # auto sets the cookie's Secure flag when the request arrived over TLS,
    # which is right behind an ingress that terminates it and right in a
    # plain-http port-forward. always | never override it.
    cookieSecure: auto
    # No login at all. For a laptop: an unauthenticated swissd reachable from a
    # Service is a deploy button for whoever finds it.
    # disabled: true
