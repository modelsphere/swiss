# Site profile: what makes a model work in THIS cluster.
name: testenv
namespace: swiss-deploy

# Charts come from the registry. A local path works for the CLI; swissd has no
# checkout to point at, so the registry is the real answer.
chartRepo: https://harbor.4pd.io/chartrepo/hardcore-tech/
# chartPath: ../charts

# --create-namespace applies the Namespace object server-side under helm v4, so
# it needs patch on namespaces even when the namespace already exists. swissd
# deploys into namespaces an admin granted it, so leave this off unless the
# ServiceAccount really should be creating them.
createNamespace: false

registry:
  # Engine images are pulled from the mirror, keeping the catalog's tag.
  mirror: harbor.4pd.io/hardcore-tech

model:
  # model.localPath, built from the catalog's source.hf.
  #   {{hf}} modelforge/Qwen3.6-35B-A3B-793303
  #   {{org}} modelforge   {{name}} Qwen3.6-35B-A3B-793303   {{model}} <entry name>
  pathTemplate: /mnt/disk0/models/{{org}}/{{name}}
  # Weights that do not sit where the template says. Kimi is at the models root
  # rather than under an org directory, and a template with no escape hatch
  # would simply make it undeployable.
  overrides:
    kimi-k2.5: /mnt/disk0/models/Kimi-K2.5

# The host compile cache. Off emits nothing under cache: at all -- the section
# does not exist in every chart version (sglang 0.7.0 has none), and a values
# file carrying a key the chart has never heard of is rejected by its schema
# rather than ignored.
cache:
  enabled: false
  # hostPath: /mnt/disk0/sglang-cache

scaler:
  serverAddress: http://decision-gen.llm-scaler.svc:80

route:
  nginxConfigMap: llm-route/openresty-conf
  monitorConfigMap: llm-route/monitor-conf

nodes:
  gpusPerNode: 8
