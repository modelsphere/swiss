# Site profile: what makes a model work in THIS cluster.
name: testenv
namespace: swiss-deploy

# Charts come from the registry. A local path works for the CLI; swissd has no
# checkout to point at, so the registry is the real answer.
chartRepo: https://modelsphere.github.io/helm-charts
# chartRepo: oci://ghcr.io/<org>/charts
# chartPath: ../charts

# --create-namespace applies the Namespace object server-side under helm v4, so
# it needs patch on namespaces even when the namespace already exists. swissd
# deploys into namespaces an admin granted it, so leave this off unless the
# ServiceAccount really should be creating them.
createNamespace: false

registry:
  # Engine images are pulled from the mirror, keeping the catalog's tag, e.g.
  # docker.io/<org> or ghcr.io/<org>. Empty uses the catalog's repository.
  mirror: ""

model:
  # model.localPath, built from the catalog's source.hf.
  #   {{hf}} Qwen/Qwen3.6-35B-A3B
  #   {{org}} Qwen   {{name}} Qwen3.6-35B-A3B   {{model}} <entry name>
  pathTemplate: /mnt/disk0/models/{{org}}/{{name}}
  # Weights that do not sit where the template says. Kimi is at the models root
  # rather than under an org directory, and a template with no escape hatch
  # would simply make it undeployable.
  overrides:
    kimi-k2.5: /mnt/disk0/models/Kimi-K2.5

# The host compile cache. Off emits nothing under cache: at all -- the section
# does not exist in every chart version (sglang 0.7.0 has none), and a values
# file carrying a key the chart has never heard of is rejected by its schema
# rather than ignored.
cache:
  enabled: false
  # hostPath: /mnt/disk0/sglang-cache

scaler:
  serverAddress: http://decision-gen.llm-scaler.svc:80
  sloAddress: http://slo-api.llm-scaler.svc:80
  # sloTokenSecret: llm-scaler/slo-api
  # sloTokenKey: token

route:
  # Where callers reach openresty from outside. Display only: swissd shows a
  # model's URL as <gateway>/<route>, and its own checks still go in-cluster.
  gateway: https://llm.example.com
  nginxConfigMap: llm-route/openresty-conf
  monitorConfigMap: llm-route/monitor-conf

nodes:
  gpusPerNode: 8

# The other clusters' swissd instances, for the nav switcher. Config, not
# discovery: a list you keep, and every instance serves the same switcher, so
# any one of them is a valid entry point.
#
# Here rather than in swissd's own config because it is a fact about the estate
# and this is the half an operator can edit from the web -- a new cluster should
# not need a helm upgrade of every other one to become reachable from them.
sites:
  - name: prod-h100
    url: https://swiss.h100.internal
  - name: dev
    url: https://swiss.dev.internal
