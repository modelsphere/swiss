name: forced-again
description: an apply past the defer timeout keeps the clock, so while the hold lasts the next pass applies at once instead of waiting out the timeout again
input:
  deferTimeoutSeconds: 600
  decision: 2
  slices: 1
  roleNotReady: true
ticks:
- expected:
    outcome: held
    hold: role not ready
    deferredFor: 0s
- advance: 10m
  expected:
    outcome: scaled-up
    timedOut: role not ready
    deferredFor: 10m
- advance: 1m
  expected:
    outcome: scaled-up
    timedOut: role not ready
    deferredFor: 11m
