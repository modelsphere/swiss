name: release-failed
description: a failed helm release scales down once it has been failed for the defer timeout
input:
  deferTimeoutSeconds: 600
  decision: 1
  slices: 2
  helmStatus: failed
ticks:
- expected:
    outcome: held
    hold: release failed
    deferredFor: 0s
- advance: 11m
  expected:
    outcome: scaled-down
    timedOut: release failed
    deferredFor: 11m
