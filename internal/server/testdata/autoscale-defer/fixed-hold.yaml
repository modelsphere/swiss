name: fixed-hold
description: a pending helm release is an apply in flight; the clock never starts and the defer timeout never applies past it
input:
  deferTimeoutSeconds: 600
  decision: 2
  slices: 1
  helmStatus: pending-upgrade
  roleNotReady: true
ticks:
- expected:
    outcome: held
    hold: helm pending
- advance: 1h
  expected:
    outcome: held
    hold: helm pending
