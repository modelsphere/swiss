name: ds-behind
description: a DisaggregatedSet whose rollout never lands, as with no room for its pods, scales once deferred for the timeout
deferTimeoutSeconds: 600
decision: 2
slices: 1
dsBehind: true
ticks:
  - wantOutcome: held
    wantHold: disaggregatedset observedGeneration behind
    wantDeferredFor: 0s
  - advance: 10m
    wantOutcome: scaled-up
    wantTimedOut: disaggregatedset observedGeneration behind
    wantDeferredFor: 10m
