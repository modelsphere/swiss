name: put-get-delete
description: put, get and delete round-trip the config
backend: helm
allowDeploy: true
managed: true
pd: true
colocate: false
wantLabels: true
steps:
  - method: PUT
    body: {enabled: true, minSlices: 1, maxSlices: 3}
    wantStatus: 200
    wantFound: true
    wantEnabled: true
    wantMin: 1
    wantMax: 3
  - method: GET
    wantStatus: 200
    wantFound: true
    wantEnabled: true
  - method: DELETE
    wantStatus: 200
    wantFound: false
  - method: GET
    wantStatus: 200
    wantFound: false
