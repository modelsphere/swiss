name: failed-past
description: a failed release scales once past the timeout
input:
  live:
    backend: helm
    helmStatus: failed
    pd: true
    dsGeneration: 1
    dsObservedGeneration: 1
    dsSlices: 1
    planReplicaCount: 1
    roles:
    - replicas: 1
      readyReplicas: 1
      updatedReplicas: 1
    routers:
    - specReplicas: 1
      readyReplicas: 1
      generation: 1
      observedGeneration: 1
  decision:
    ok: true
    replicas: 2
  timeout: 10m
  deferredFor: 11m
expected:
  hold: ''
  timedOut: release failed
  scale: true
  deferredFor: 11m
