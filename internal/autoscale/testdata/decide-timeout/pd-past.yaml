name: pd-past
description: a role growth held by readiness applies at the timeout
input:
  live:
    backend: helm
    helmStatus: deployed
    pd: true
    dsGeneration: 1
    dsObservedGeneration: 1
    dsSlices: 1
    planReplicaCount: 1
    engines:
      prefill: 1
      decode: 1
    roles:
    - replicas: 2
      readyReplicas: 1
      updatedReplicas: 2
    routers:
    - specReplicas: 1
      readyReplicas: 1
      generation: 1
      observedGeneration: 1
  decision:
    ok: true
    replicas: 1
    pd:
      prefill: 2
      decode: 1
  timeout: 10m
  deferredFor: 10m
expected:
  hold: ''
  timedOut: role not ready
  scale: true
  deferredFor: 10m
