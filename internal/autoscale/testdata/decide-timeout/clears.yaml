name: clears
description: a pass with no hold that times out clears the clock
live:
  backend: helm
  helmStatus: deployed
  pd: true
  dsGeneration: 1
  dsObservedGeneration: 1
  dsSlices: 1
  planReplicaCount: 1
  roles:
  - replicas: 1
    readyReplicas: 1
    updatedReplicas: 1
  routers:
  - specReplicas: 1
    readyReplicas: 1
    generation: 1
    observedGeneration: 1
decision:
  ok: true
  replicas: 2
timeout: 10m
deferredFor: 9m
wantHold: ''
wantScale: true
