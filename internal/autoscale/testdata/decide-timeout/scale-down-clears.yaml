name: scale-down-clears
description: readiness does not hold a scale-down, so it clears the clock
live:
  backend: helm
  helmStatus: deployed
  pd: true
  dsGeneration: 1
  dsObservedGeneration: 1
  dsSlices: 2
  planReplicaCount: 1
  roles:
  - replicas: 2
    readyReplicas: 1
    updatedReplicas: 2
  routers:
  - specReplicas: 1
    readyReplicas: 1
    generation: 1
    observedGeneration: 1
decision:
  ok: true
  replicas: 1
timeout: 10m
deferredFor: 9m
wantHold: ''
wantScale: true
