name: pd-rebalance-not-ready
description: growing one role while shrinking the other still waits for readiness
input:
  live:
    backend: helm
    helmStatus: deployed
    pd: true
    dsGeneration: 1
    dsObservedGeneration: 1
    dsSlices: 1
    planReplicaCount: 1
    engines:
      prefill: 2
      decode: 2
    roles:
    - replicas: 2
      readyReplicas: 1
      updatedReplicas: 2
    - replicas: 1
      readyReplicas: 1
      updatedReplicas: 1
    routers:
    - specReplicas: 1
      readyReplicas: 1
      generation: 1
      observedGeneration: 1
  decision:
    ok: true
    replicas: 1
    pd:
      prefill: 3
      decode: 1
expected:
  hold: 'role not ready'
  scale: false
  current: 1
  want: 0
  currentPD:
    prefill: 2
    decode: 2
  hasDecision: true
