name: timeout-ds-observed
description: a timeout lets a scale-up through a DisaggregatedSet whose status lags its generation
input:
  live:
    backend: helm
    helmStatus: deployed
    pd: true
    dsGeneration: 3
    dsObservedGeneration: 2
    dsSlices: 1
    planReplicaCount: 1
  timedOut: true
  decision:
    ok: true
    replicas: 2
expected:
  hold: ""
  timedOut: disaggregatedset observedGeneration behind
  scale: true
  current: 1
  want: 2
  hasDecision: true
