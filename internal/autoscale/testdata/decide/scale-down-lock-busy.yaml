name: scale-down-lock-busy
description: a scale-down still holds while the per-release lock is busy
config:
  enabled: true
  minSlices: 1
  maxSlices: 5
live:
  backend: helm
  helmStatus: deployed
  pd: true
  dsGeneration: 1
  dsObservedGeneration: 1
  dsSlices: 3
  planReplicaCount: 3
  lockBusy: true
  roles:
    - replicas: 1
      readyReplicas: 1
      updatedReplicas: 1
  routers:
    - specReplicas: 1
      readyReplicas: 1
      generation: 1
      observedGeneration: 1
    - specReplicas: 1
      readyReplicas: 1
      generation: 1
      observedGeneration: 1
    - specReplicas: 1
      readyReplicas: 1
      generation: 1
      observedGeneration: 1
decision:
  ok: true
  replicas: 1
wantHold: "apply in progress"
wantScale: false
wantCurrent: 3
want: 0
wantFailed: false
hasDecision: true
