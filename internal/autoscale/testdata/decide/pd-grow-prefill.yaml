name: pd-grow-prefill
description: a shape.pd decision moves the roles and keeps the slices
input:
  live:
    backend: helm
    helmStatus: deployed
    pd: true
    dsGeneration: 1
    dsObservedGeneration: 1
    dsSlices: 1
    planReplicaCount: 1
    engines:
      prefill: 2
      decode: 1
    roles:
    - replicas: 2
      readyReplicas: 2
      updatedReplicas: 2
    - replicas: 1
      readyReplicas: 1
      updatedReplicas: 1
    routers:
    - specReplicas: 1
      readyReplicas: 1
      generation: 1
      observedGeneration: 1
  decision:
    ok: true
    replicas: 1
    pd:
      prefill: 3
      decode: 1
expected:
  hold: ''
  scale: true
  current: 1
  want: 1
  wantPD:
    prefill: 3
    decode: 1
  currentPD:
    prefill: 2
    decode: 1
  hasDecision: true
