name: guard-router-missing
description: a missing router deployment holds the tick
input:
  live:
    backend: helm
    helmStatus: deployed
    pd: true
    dsGeneration: 1
    dsObservedGeneration: 1
    dsSlices: 1
    planReplicaCount: 1
    roles:
    - replicas: 1
      readyReplicas: 1
      updatedReplicas: 1
    routers:
    - missing: true
      specReplicas: 1
      readyReplicas: 0
  decision:
    ok: true
    replicas: 2
expected:
  hold: router not ready
  scale: false
  current: 1
  want: 0
  hasDecision: true
