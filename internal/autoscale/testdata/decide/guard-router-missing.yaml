name: guard-router-missing
description: a missing router deployment holds the tick
config:
  enabled: true
  minSlices: 1
  maxSlices: 4
live:
  backend: helm
  helmStatus: deployed
  pd: true
  dsGeneration: 1
  dsObservedGeneration: 1
  dsSlices: 1
  planReplicaCount: 1
  roles:
    - replicas: 1
      readyReplicas: 1
      updatedReplicas: 1
  routers:
    - missing: true
      specReplicas: 1
      readyReplicas: 0
decision:
  ok: true
  replicas: 2
wantHold: "router not ready"
wantScale: false
wantCurrent: 1
want: 0
wantFailed: false
hasDecision: true
