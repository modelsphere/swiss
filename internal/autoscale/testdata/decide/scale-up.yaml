name: scale-up
description: a decision above the current count scales up
config:
  enabled: true
  minSlices: 1
  maxSlices: 5
live:
  backend: helm
  helmStatus: deployed
  pd: true
  dsGeneration: 1
  dsObservedGeneration: 1
  dsSlices: 1
  planReplicaCount: 1
  roles:
    - replicas: 1
      readyReplicas: 1
      updatedReplicas: 1
  routers:
    - specReplicas: 1
      readyReplicas: 1
      generation: 1
      observedGeneration: 1
decision:
  ok: true
  replicas: 3
wantHold: ""
wantScale: true
wantCurrent: 1
want: 3
wantFailed: false
hasDecision: true
