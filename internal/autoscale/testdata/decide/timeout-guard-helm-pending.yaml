name: timeout-guard-helm-pending
description: a timeout does not skip a fixed hold; a pending helm release holds the tick
input:
  live:
    backend: helm
    helmStatus: pending-upgrade
    pd: true
    planReplicaCount: 1
  timedOut: true
  decision:
    ok: true
    replicas: 2
expected:
  hold: helm pending
  scale: false
  current: 1
  want: 0
  hasDecision: true
