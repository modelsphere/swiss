# swissd runs one replica. The read path is stateless, so more would work -- but
# the database is SQLite, a single writer, on a PVC or an emptyDir. Scaling out
# is a Postgres decision, not a replica-count one.
replicaCount: 1

image:
  repository: ghcr.io/modelsphere/swissd
  # Empty follows the chart's appVersion, so a chart bump and an image bump
  # cannot silently disagree.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# ---------------------------------------------------------------------------
# swiss.yaml, rendered into a ConfigMap. One document, the same shape the CLI
# reads: `swiss` and `swissd` are one tool, and two config formats would
# eventually disagree.
# ---------------------------------------------------------------------------
config:
  # The catalog: an https base or a path. index.json is appended when the
  # location does not already name a .json file. No git; a catalog is a
  # published index plus the documents it points at.
  #
  # The default, not the last word: a site profile naming a catalog of its own
  # wins, which is how it gets repointed from the web without a helm upgrade.
  # This value is what a fresh install reads until then, and what `swiss` on a
  # laptop reads always -- the CLI cannot read the profile ConfigMap.
  catalog: "https://modelsphere.github.io/model-catalog/"

  cluster:
    # The site profile ConfigMap, "namespace/name". Empty means <release>-profile
    # in this namespace, which swissd creates the first time the profile is
    # saved from the web. The chart writes no profile of its own: two writers of
    # one document is how an edit made in the UI gets reverted by the next
    # `helm upgrade`.
    profile: ""
    profileKey: profile.yaml

  # How long a fetched catalog or profile is reused before refetching.
  cacheTTL: 60s

  # Drafts, plans and the audit log. Never the source of truth for what is
  # deployed -- every applied plan is also written beside its release.
  database: /data/swiss.db

# ---------------------------------------------------------------------------
# The site login: one account, mounted into the pod as files.
#
# A Secret volume rather than an API read -- the kubelet keeps the files
# current, so rotating the password takes effect at the next login instead of
# the next restart, and swissd needs no Secret grant of its own to log anybody
# in.
#
# Leave password empty and the chart generates one on first install and reads
# it back on every upgrade after that, so `helm upgrade` never rotates it out
# from under you. Read it with:
#
#   kubectl get secret <release>-auth -o jsonpath='{.data.password}' | base64 -d
# ---------------------------------------------------------------------------
auth:
  create: true
  username: admin
  # Empty generates one. Set it to choose your own; it then lives in your values
  # file, which is the tradeoff.
  password: ""

  # Point at a Secret you made yourself, with keys username, password and optionally tokenKey and proxyKey. The chart then creates none.
  existingSecret: ""

  # For swissd behind a front proxy that logs users in itself (console). Adds a
  # generated proxyKey to the Secret; a request with `Authorization: Bearer
  # <proxyKey>` is authenticated, and its X-Remote-User names the user. Give the
  # key to the proxy and nothing else: it opens the API. The password login
  # stays on beside it, so reaching swissd directly still needs the password --
  # unlike auth.disabled, which opens swissd to anything in the cluster.
  proxyKey: false

  # How long a login lasts. Long enough not to interrupt a 40-minute model load
  # being watched; short enough that a forgotten tab is not a standing key. A
  # session in active use is extended rather than cut off.
  tokenTTL: 24h

  # auto sets the session cookie's Secure flag when the request arrived over
  # TLS, which is right behind an ingress that terminates it and right in a
  # plain-http port-forward. always | never override it.
  cookieSecure: auto

  # No login at all.
  disabled: false

# ---------------------------------------------------------------------------
# RBAC. Read the comments before widening this.
# ---------------------------------------------------------------------------
# swissd deploys, and writes its own site profile and the Secret beside it: the
# chart always grants both. One replica: sqlite is a single writer.
#
# The deploy grant is everything the sglang and vllm charts render, in the
# namespaces rbac.scope selects, and nothing else:
#
#   core                          configmaps, services, serviceaccounts, secrets
#   apps                          deployments
#   policy                        poddisruptionbudgets
#   rbac                          roles, rolebindings   (the cart subchart)
#   monitoring.coreos.com         servicemonitors
#   leaderworkerset.x-k8s.io      leaderworkersets
#   disaggregatedset.x-k8s.io     disaggregatedsets    (sglang prefill/decode)
#   autoscaling.modelsphere.dev   llmscalers           (and autoscaling.modelsphere.dev)
#   inference.modelsphere.dev     llmslorequirements   (and inference.modelsphere.dev)
#   routing.modelsphere.dev       modelroutes          (and routing.modelsphere.dev)
#
# The profile grant is configmaps and secrets create/update in the profile's
# namespace -- the profile and <profile>-secrets, which holds what the web sets,
# a writable catalog's token. RBAC cannot scope a create to one name.
rbac:
  create: true

  # namespaced (default) or cluster.
  #
  # swissd reads helm's own release storage, which is SECRETS. Kubernetes RBAC
  # cannot filter a secret read by label or name prefix, so "let it read helm
  # releases" and "let it read every credential in those namespaces" are the
  # same grant. There is no third option.
  #
  #   namespaced  Role/RoleBinding in each namespace listed below. Tight, and
  #               the default -- but swissd can only see releases in those
  #               namespaces, so an unlisted namespace is invisible rather than
  #               reported as untracked.
  #   cluster     One ClusterRole. swissd sees every release, which is what makes
  #               the untracked-release view complete -- at the cost of read
  #               access to every Secret in the cluster.
  #
  # Start namespaced. Widen deliberately, knowing what it grants.
  scope: namespaced

  # Cluster-wide pod LIST, for the GPU usage column on the nodes page.
  #
  # A node publishes how many GPUs it has and how many are allocatable, never
  # how many are in use -- that has to be summed from the pods bound to it, and
  # a sum taken over only the namespaces below would under-report every GPU held
  # elsewhere. Off means swissd shows capacity and reports usage as unknown,
  # which is the honest answer when it cannot see every pod.
  nodeGPUUsage: true

  # Namespaces holding model releases. Used when scope is namespaced.
  namespaces: []
    # - models
    # - kimi

serviceAccount:
  create: true
  name: ""
  annotations: {}

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  # Predictable hostnames keep the peer list trivial: swiss.<cluster>.internal.
  host: ""
  path: /
  pathType: Prefix
  tls: []

# CPU-only, and small: swissd holds no model and does no rendering of its own.
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  # The binary and its embedded UI are all swissd needs. Writes (the database,
  # helm's caches) go to mounted volumes, so the root filesystem stays read-only.
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# swissd is CPU-only, so it has no business occupying a GPU node -- the same
# reasoning the sglang chart applies to CART. Preferred rather than required, so
# it still schedules in a cluster where every node carries GPUs.
affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: nvidia.com/gpu.product
              operator: DoesNotExist

nodeSelector: {}
tolerations: []

podAnnotations: {}
podLabels: {}

logLevel: info

# Scratch space for helm caches and the per-operation workspace.
tmpSizeLimit: 1Gi

# SQLite: the audit log and the stored plans. enabled creates a PVC.
# existingClaim names one you already have, and no PVC is rendered. When
# enabled is false and existingClaim is empty, the database is an emptyDir and
# a pod restart or reschedule loses it -- the audit log (who applied or
# upgraded what, with the output) and the stored plans (the release -> plan
# history used to roll back or revert to an earlier plan). What is deployed
# stays visible and upgradable, because each applied plan is also written
# beside its release. Use a volume in production.
#
# Switching an existing release from the chart-created PVC to no persistence,
# or to existingClaim naming that same PVC, makes helm delete that PVC (and,
# with the usual Delete reclaim policy, its data). Back the data up or migrate
# it to a separately created PVC first, or keep the PVC by running this before
# the upgrade:
#
#   kubectl -n <namespace> annotate pvc <fullname>-data helm.sh/resource-policy=keep
persistence:
  enabled: true
  size: 10Gi
  storageClass: ""
  existingClaim: ""
  # Only the emptyDir fallback reads this. Empty renders no sizeLimit.
  emptyDir:
    sizeLimit: ""

updateStrategy: {}

# /healthz is liveness: the process is up. /readyz gates on reaching the cluster
# and nothing else -- the catalog is fetched lazily, so an unreachable one must
# not take this pod out of the Service.
livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 3
  periodSeconds: 10
readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 3
  periodSeconds: 10
  failureThreshold: 3

# ---------------------------------------------------------------------------
# catalog-server: a catalog of your own, vendored from model-catalog's
# catalog-server/chart (templates/catalog-server/). Off by default. On, it is
# installed beside swissd as <release>-catalog-server; point a site profile
# catalog at it, writable, to edit it from the web. Everything below enabled is
# that chart's values.
# ---------------------------------------------------------------------------
catalogServer:
  enabled: false
  # catalog-server, with model-catalog's web app, in one pod: the image
  # (catalog-server/Dockerfile) serves the catalog's git repository, kept on a
  # volume, its write API, and the pages. Settings are catalog-server's config
  # file (catalog-server.example.yaml), rendered from config below.
  image:
    repository: ghcr.io/modelsphere/catalog-server
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  imagePullSecrets: []

  nameOverride: ""
  fullnameOverride: ""

  config:
    # The path it is served under: /catalog/ behind an ingress that keeps the
    # prefix. Where clients reach it is the catalog's own say, its catalog.yaml's
    # site and raw, written when it is set up; the chart routes to it (ingress,
    # service) and does not check the two agree.
    basePath: /
    # The branch served and written: the repository's HEAD when empty; for a
    # catalog set up here, its first branch's name.
    branch: ""
    # Seconds between looks at the branch, for a change pushed to the repository
    # by someone else; 0 never.
    syncInterval: 30
    # Who commits; each commit's author is the token's holder.
    committer:
      name: catalog-server
      email: catalog-server@localhost
    # Serve the web app built into the image, under basePath.
    pages: true
    # Any other setting, merged over the above (catalog-server.example.yaml).
    extra: {}

  # Who may write, and set an empty catalog up. Neither set: the catalog is
  # read-only, and the web app offers no editing.
  tokens:
    # A Secret of your own, holding the tokens file (README.md, Tokens) at key.
    existingSecret: ""
    key: tokens.yaml
    # Or the entries themselves, rendered into a Secret: {name, email, sha256}
    # -- the sha256 of the token, printf %s "$TOKEN" | sha256sum -- or {name,
    # email, token}.
    entries: []
    # - name: Ada Lovelace
    #   email: ada@example.com
    #   sha256: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08

  # The catalog's git repository lives on this volume, at /data/catalog: made
  # there by setting the catalog up, or a bare clone you put there.
  persistence:
    enabled: true
    # A PVC that exists already (holding a catalog, say) instead of a new one.
    existingClaim: ""
    storageClass: "" # empty: the cluster's default
    accessModes: [ReadWriteOnce]
    size: 2Gi
    # The chart's own PVC is kept on helm uninstall: it is the catalog, history
    # and all. Delete it by hand when done.
    keep: true

  service:
    type: ClusterIP
    port: 80

  ingress:
    enabled: false
    className: ""
    annotations: {}
    host: ""
    path: /
    pathType: Prefix
    tls: []

  # Or a Gateway API HTTPRoute, attached to a Gateway of yours.
  httpRoute:
    enabled: false
    annotations: {}
    # The Gateways it attaches to.
    parentRefs: []
    # - name: gateway-infra
    #   namespace: monitoring
    #   sectionName: http
    hostnames: []
    path: /
    pathType: PathPrefix

  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: "1", memory: 512Mi }

  podAnnotations: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000 # the image's node user
    runAsGroup: 1000
    fsGroup: 1000
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities: { drop: [ALL] }

  nodeSelector: {}
  tolerations: []
  affinity: {}
