apiVersion: v2
name: swiss
description: >-
  swissd -- the Swiss deploy control plane for the sglang and vllm charts. One
  instance per cluster, running inside the cluster it manages: it reads the
  model catalog over HTTP, reads this cluster's releases and nodes through its
  own ServiceAccount, and serves the web UI embedded in its binary.
type: application
version: 0.1.0
appVersion: "0.1.0"

# Swiss does not deploy Swiss. This chart is installed by helm or helmfile like
# any other release, and swissd's own upgrades go the same way -- never through
# its own UI. That keeps the bootstrap one-directional and stops a bad deploy
# from taking away the tool you would use to fix it.
