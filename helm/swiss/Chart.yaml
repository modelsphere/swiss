apiVersion: v2
name: swiss
description: >-
  swissd -- the Swiss deploy control plane for the sglang and vllm charts. One
  instance per cluster, running inside the cluster it manages: it reads the
  model catalog over HTTP, reads this cluster's releases and nodes through its
  own ServiceAccount, and serves the web UI embedded in its binary.
type: application
version: 0.6.3
appVersion: "0.6.3"
