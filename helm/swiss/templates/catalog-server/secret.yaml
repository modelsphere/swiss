{{- if .Values.catalogServer.enabled }}{{- with fromYaml (include "swiss.catalogServer" .) }}
{{- if and .Values.tokens.entries (not .Values.tokens.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "catalog-server.tokensSecret" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "catalog-server.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.tokens.key }}: |-
{{ toYaml .Values.tokens.entries | indent 4 }}
{{- end }}
{{- end }}{{- end }}
