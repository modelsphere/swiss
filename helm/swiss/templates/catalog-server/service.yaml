{{- if .Values.catalogServer.enabled }}{{- with fromYaml (include "swiss.catalogServer" .) }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "catalog-server.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "catalog-server.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "catalog-server.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}{{- end }}
