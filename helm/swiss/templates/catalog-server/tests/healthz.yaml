{{- if .Values.catalogServer.enabled }}{{- with fromYaml (include "swiss.catalogServer" .) }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "catalog-server.fullname" . }}-healthz
  namespace: {{ .Release.Namespace }}
  labels: {{- include "catalog-server.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets: {{- toYaml . | nindent 4 }}
  {{- end }}
  securityContext: {{- toYaml .Values.podSecurityContext | nindent 4 }}
  containers:
    # The server's own image: node, to fetch with. It answers /healthz and
    # serves index-v2.json.
    - name: healthz
      image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      securityContext: {{- toYaml .Values.securityContext | nindent 8 }}
      command:
        - node
        - -e
        - |
          const base = {{ include "catalog-server.url" . | quote }};
          const origin = new URL(base).origin;
          (async () => {
            for (const url of [`${origin}/healthz`, `${base}index-v2.json`]) {
              const res = await fetch(url);
              console.log(res.status, url);
              if (!res.ok) process.exit(1);
            }
          })().catch((err) => (console.error(err.message), process.exit(1)));
{{- end }}{{- end }}
