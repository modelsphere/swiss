{{- if and .Values.auth.create (not .Values.auth.disabled) }}
{{- /*
The site login: one account, mounted into the pod as files.

A volume rather than an API read, because that is what a Secret volume is --
the kubelet keeps the files current, so rotating the password takes effect at
the next login instead of at the next restart, and swissd needs no Secret grant
of its own to log anybody in.

The password and the token key are generated once and then read back from the
live Secret on every upgrade. Regenerating them would rotate the operator's
password and log every open session out on an unrelated `helm upgrade`, which
is the sort of surprise that gets a chart distrusted.
*/}}
{{- $name := printf "%s-auth" (include "swiss.fullname" .) }}
{{- $live := (lookup "v1" "Secret" .Release.Namespace $name) }}
{{- $livePass := "" }}
{{- $liveKey := "" }}
{{- $liveProxy := "" }}
{{- if $live }}
{{- $livePass = b64dec (dig "data" "password" "" ($live | toYaml | fromYaml)) }}
{{- $liveKey = b64dec (dig "data" "tokenKey" "" ($live | toYaml | fromYaml)) }}
{{- $liveProxy = b64dec (dig "data" "proxyKey" "" ($live | toYaml | fromYaml)) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "swiss.labels" . | nindent 4 }}
  annotations:
    # A generated password is not in any values file, so helm is the only copy.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  username: {{ .Values.auth.username | quote }}
  password: {{ .Values.auth.password | default $livePass | default (randAlphaNum 24) | quote }}
  # Signs session tokens. Kept beside the password rather than generated per
  # process, so a swissd restart does not log everybody out.
  tokenKey: {{ $liveKey | default (randAlphaNum 48) | quote }}
  {{- if .Values.auth.proxyKey }}
  # What the front proxy sends as its Bearer. Read back like the others, so an
  # upgrade does not cut the proxy off.
  proxyKey: {{ $liveProxy | default (randAlphaNum 48) | quote }}
  {{- end }}
{{- end }}
