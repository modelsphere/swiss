name: publish

# The swissd image and the swiss chart, both on GHCR, at one version. The chart is
# packaged pointing at the image pushed beside it (image.repository, appVersion).
#
#   push to master   <appVersion>-git<sha7>
#   tag <X>          <X>, which must be Chart.yaml's appVersion (hack/bump.sh --tag); the image is also latest
#   pull request     build, lint and package; nothing pushed
on:
  push:
    branches: [master]
    tags: ["[0-9]+.[0-9]+.[0-9]+*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PUSH: ${{ github.event_name != 'pull_request' }}
    steps:
      - name: Check out, with the web/console submodule
        uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false

      - name: Version
        id: v
        run: |
          set -eu
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          app=$(sed -n 's/^appVersion: *"\{0,1\}\([^"]*\)"\{0,1\}/\1/p' helm/swiss/Chart.yaml)
          image="ghcr.io/$owner/swissd"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version=${GITHUB_REF#refs/tags/}
            if [ "$version" != "$app" ]; then
              echo "tag $version, but helm/swiss/Chart.yaml appVersion is $app" >&2
              exit 1
            fi
            tags="$image:$version,$image:latest"
          else
            version="$app-git${GITHUB_SHA:0:7}"
            tags="$image:$version"
          fi
          {
            echo "version=$version"
            echo "image=$image"
            echo "tags=$tags"
            echo "charts=oci://ghcr.io/$owner/charts"
          } >>"$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.v.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.3.0

      - name: Package the chart
        env:
          VERSION: ${{ steps.v.outputs.version }}
          IMAGE: ${{ steps.v.outputs.image }}
        run: |
          set -eu
          sed "s|^  repository: .*/swissd\$|  repository: $IMAGE|" helm/swiss/values.yaml >values.tmp
          mv values.tmp helm/swiss/values.yaml
          grep -q "^  repository: $IMAGE\$" helm/swiss/values.yaml \
            || { echo "image.repository in helm/swiss/values.yaml was not repointed at $IMAGE" >&2; exit 1; }
          helm lint --strict helm/swiss --set 'rbac.namespaces={ci}'
          helm package helm/swiss --version "$VERSION" --app-version "$VERSION" --destination dist

      - name: Push the chart
        if: env.PUSH == 'true'
        env:
          VERSION: ${{ steps.v.outputs.version }}
          CHARTS: ${{ steps.v.outputs.charts }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          printf '%s' "$TOKEN" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          helm push "dist/swiss-$VERSION.tgz" "$CHARTS"
