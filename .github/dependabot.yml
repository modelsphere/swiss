version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      k8s:
        patterns: ["k8s.io/*", "sigs.k8s.io/*"]
    # Hold k8s libs at the current minor (0.36): client-go is only guaranteed
    # against a cluster of its own minor, our target clusters are 1.36 or
    # older, and this keeps us matched to llm-operator. Patches still flow.
    ignore:
      - dependency-name: "k8s.io/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"

  # Runtime majors (Node, Go) move by hand once the new one is LTS, together
  # with CI and the docs.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "golang"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    commit-message:
      prefix: "chore(deps)"

  # web/console: the UI is built from console's web/ at this pin.
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(web)"
