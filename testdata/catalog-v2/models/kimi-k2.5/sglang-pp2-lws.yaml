apiVersion: catalog.swiss/v2
kind: Variant
model: kimi-k2.5
id: sglang-pp2-lws
version: 1.0.0
servedName: kimi-k2.5
engine: sglang
description: TP8 per node, PP2 across two nodes over IB.
chart:
  name: sglang
  version: ">=0.7.0"
image:
  repository: 4pdosc/sglang
  tag: v0.5.10.post1-gm-fix-v0.1
requires:
  gpus: 8 # per pod; 16 across the group
  nodes: 2
  topology: lws
  rdma: true
  gpuProduct:
    - NVIDIA-H100-80GB-HBM3
    - NVIDIA-H800
values:
  model:
    mountPath: /model
    hostPathType: Directory
    contextLength: ""
  lws:
    enabled: true
    size: 2
  extraArgs:
    - --tp=8
    - --pp-size=2
    # NCCL's default rendezvous timeout is 600s, which a worker's cold start
    # can lose to; the leader then exits and restarts the group into the
    # same race.
    - --dist-timeout=1800
    - --trust-remote-code
    - --enable-cache-report
    - --stream-response-default-include-usage
    - --tokenizer-worker-num=4
    - --tool-call-parser=kimi_k2
    - --reasoning-parser=kimi_k2
  env:
    - name: NCCL_DEBUG
      value: WARN
    - name: NCCL_IB_DISABLE
      value: "0"
    - name: NCCL_NET_GDR_LEVEL
      value: "2"
    - name: NCCL_SOCKET_IFNAME
      value: eth0
    - name: GLOO_SOCKET_IFNAME
      value: eth0
    - name: PYTORCH_ALLOC_CONF
      value: expandable_segments:True
    - name: NVIDIA_DISABLE_REQUIRE
      value: "1"
  resources:
    requests:
      ephemeral-storage: 28Gi
    limits:
      rdma/hca_shared: "1"
      ephemeral-storage: 28Gi
  volumes:
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 16Gi
  volumeMounts:
    - name: dshm
      mountPath: /dev/shm
  # 160 x 15s = 40 minutes. A warm-cache start already takes ~10, and
  # killing a leader mid-load restarts the weight read.
  startupProbe:
    httpGet:
      path: /v1/models
      port: http
    periodSeconds: 15
    timeoutSeconds: 10
    failureThreshold: 160
  terminationGracePeriodSeconds: 3600
  lifecycle:
    preStop:
      enabled: true
      endpointSyncSeconds: 5
      drainSeconds: 600
    forceShutdown: true
  hangWatcher:
    enabled: true
